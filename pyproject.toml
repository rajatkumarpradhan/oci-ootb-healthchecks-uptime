[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-ootb-healthchecks-uptime"
version = "0.1.0"
description = "OCI Health Checks monitor template plus an offline uptime/SLO analyzer for result exports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
oci-ootb-healthchecks-uptime = "oci_ootb_healthchecks_uptime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
